<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doni (@endonian92)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10121a;
    --bg-soft: #171a25;
    --panel: #1b1e2b;
    --line: #2a2e3f;
    --text: #e7e6e0;
    --text-dim: #8b8fa3;
    --accent: #e0a458;     /* amber - keyword-ish */
    --accent-2: #5fb3a3;   /* teal - string-ish */
    --accent-3: #d17a8f;   /* rose - tag-ish */
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(224,164,88,0.07), transparent 60%),
      radial-gradient(1000px 500px at 100% 10%, rgba(95,179,163,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    line-height: 1.6;
  }

  .window{
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02);
    overflow: hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
  }
  .dot{ width:11px; height:11px; border-radius:50%; display:inline-block; }
  .dot.r{ background:#e5645a; }
  .dot.y{ background:#e5b84b; }
  .dot.g{ background:#5cc36a; }
  .titlebar-label{
    margin-left: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .term{
    padding: 32px clamp(20px, 5vw, 40px) 8px;
    font-family:'JetBrains Mono', monospace;
  }

  .line{
    display:flex;
    gap: 10px;
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .prompt{ color: var(--accent-2); flex-shrink:0; }
  .cmd{ color: var(--text); }

  .name{
    margin: 18px 0 4px;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .name .caret{
    display:inline-block;
    width: 0.5em;
    background: var(--accent);
    margin-left: 4px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .handle{
    font-size: 15px;
    color: var(--accent-2);
    margin-bottom: 28px;
  }
  .handle a{ color: inherit; text-decoration: none; border-bottom: 1px dashed rgba(95,179,163,0.4); }
  .handle a:hover{ border-bottom-color: var(--accent-2); }

  .section-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin: 0 0 12px;
  }
  .section-label::before{ content: "// "; color: var(--accent-3); }

  section{ padding: 0 clamp(20px, 5vw, 40px) 30px; }
  section + section{ border-top: 1px solid var(--line); padding-top: 26px; }

  .langs{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .lang{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 6px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .lang .sw{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .lang.python .sw{ background: #4b8bbe; }
  .lang.cpp .sw{ background: #5a95d4; }
  .lang.js .sw{ background: #e0c458; }

  .projects{ display:flex; flex-direction:column; gap: 2px; }
  .project{
    display:flex;
    align-items: baseline;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 8px;
    text-decoration:none;
    color: var(--text);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .project:hover, .project:focus-visible{
    background: var(--bg-soft);
    transform: translateX(2px);
  }
  .project:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .project .icon{ color: var(--accent); font-family:'JetBrains Mono', monospace; flex-shrink:0; }
  .project .info{ display:flex; flex-direction:column; gap: 2px; min-width:0; }
  .project .pname{
    font-family:'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14.5px;
  }
  .project .purl{
    font-size: 12.5px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  footer{
    padding: 20px clamp(20px, 5vw, 40px) 26px;
    border-top: 1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a{ color: var(--text-dim); }
  footer a:hover{ color: var(--accent-2); }

  @media (prefers-reduced-motion: reduce){
    .name .caret{ animation: none; opacity: 1; }
  }
</style>
</head>
<body>

  <div class="window" role="main">
    <div class="titlebar">
      <span class="dot r"></span>
      <span class="dot y"></span>
      <span class="dot g"></span>
      <span class="titlebar-label">doni@endonian92: ~</span>
    </div>

    <div class="term">
      <div class="line"><span class="prompt">$</span><span class="cmd">whoami</span></div>
      <h1 class="name">Doni<span class="caret">&nbsp;</span></h1>
      <div class="handle"><a href="https://github.com/endonian92" target="_blank" rel="noopener">@endonian92</a></div>
    </div>

    <section>
      <p class="section-label">stack</p>
      <div class="langs">
        <span class="lang python"><span class="sw"></span>Python</span>
        <span class="lang cpp"><span class="sw"></span>C++</span>
        <span class="lang js"><span class="sw"></span>JavaScript</span>
      </div>
    </section>

    <section>
      <p class="section-label">projects</p>
      <div class="projects">
        <a class="project" href="https://endonian92.github.io/Legacy/toinsai" target="_blank" rel="noopener">
          <span class="icon">▸</span>
          <span class="info">
            <span class="pname">toinsai</span>
            <span class="purl">endonian92.github.io/Legacy/toinsai</span>
          </span>
        </a>
        <a class="project" href="https://endonian92.github.io/nat'l-route-ashiato" target="_blank" rel="noopener">
          <span class="icon">▸</span>
          <span class="info">
            <span class="pname">nat'l-route-ashiato</span>
            <span class="purl">endonian92.github.io/nat'l-route-ashiato</span>
          </span>
        </a>
      </div>
    </section>

    <footer>
      <span>© 2026 Doni</span>
      <a href="https://github.com/endonian92" target="_blank" rel="noopener">github.com/endonian92</a>
    </footer>
  </div>

</body>
</html>
